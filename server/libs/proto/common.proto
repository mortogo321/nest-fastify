syntax = "proto3";

package nest.app;

message Empty {}

message FindOneRequest {
    string id = 1;
}

message PaginationDto {
    int32 page = 1;
    int32 limit = 2;
}

message StatusResponse {
    bool success = 1;
    string message = 2;
}

message ErrorResponse {
    string code = 1;
    string message = 2;
    string details = 3;
}
